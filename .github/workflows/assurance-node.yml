name: Assurance Node workflows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare npm workspace fixture
        run: cp -R .assurance/node-fixtures/npm/. .
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Enable the declared npm version
        run: corepack enable npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: echo "No tests configured yet - see docs/sdlc/harness.md"
  npm-copilot:
    runs-on: ubuntu-latest
