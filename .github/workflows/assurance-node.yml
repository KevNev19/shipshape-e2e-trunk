name: Assurance Node workflows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-ci-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare npm workspace fixture
        run: cp -R .assurance/node-fixtures/npm/. .
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install the declared npm version
        run: npm install --global npm@10.8.2
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  npm-copilot-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare npm workspace fixture
        run: cp -R .assurance/node-fixtures/npm/. .
      - uses: actions/setup-node@v7
