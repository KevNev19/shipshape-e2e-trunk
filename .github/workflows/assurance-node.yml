      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  pnpm-ci-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pnpm workspace fixture
        run: cp -R .assurance/node-fixtures/pnpm/. .
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pinned Corepack
        run: npm install --global corepack@0.34.7
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
