# Repo-local automation (not part of the shipshape kit's templates): every
# Monday, gather the raw security and quality data for this repository into
# an issue, and request handoff to the security-quality custom agent
# (.github/agents/security-quality.md) to write the prioritized report.
#
# Assignment to Copilot requires a user token: set the ACTIONS_PAT repo
# secret with the repository and alert access needed by this workflow, owned
# by a user with Copilot access. Without it, the issue is still created and can
# be handed to the agent manually:
#   gh agent-task create --custom-agent security-quality -F <issue-body>
name: Security & quality report

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: read
  actions: read

jobs:
  gather-and-assign:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.ACTIONS_PAT != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Gather alert and CI data
        env:
          # Dependabot and secret-scanning alert APIs are not readable by the
          # built-in workflow token; the ACTIONS_PAT secret (when set) closes
          # that gap — without it those sections degrade to an access note.
          GH_TOKEN: ${{ secrets.ACTIONS_PAT || github.token }}
          REPO: ${{ github.repository }}
        run: |
          assignment_status=manual_handoff
          if [ "$HAS_PAT" = "true" ]; then
            assignment_status=requested
          fi
          python3 scripts/security_report.py \
            --repo "$REPO" \
            --root . \
            --assignment-status "$assignment_status" \
            > "$RUNNER_TEMP/security-quality-report.json"
          python3 - "$RUNNER_TEMP/security-quality-report.json" \
            "$RUNNER_TEMP/security-quality-report.md" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          Path(sys.argv[2]).write_text(report["body"], encoding="utf-8")
          print(json.dumps({"status": report["status"], "ok": report["ok"]}))
          PY
      - name: Create the report issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          url=$(gh issue create --repo "$REPO" \
            --title "Security & quality report $(date -u +%Y-%m-%d)" \
            --body-file "$RUNNER_TEMP/security-quality-report.md")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
      - name: Assign to the security-quality agent (needs ACTIONS_PAT)
        if: ${{ env.HAS_PAT == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          set -u
          owner="${REPO%%/*}"; name="${REPO##*/}"
          bot_id=$(gh api graphql -f query="query { repository(owner:\"$owner\", name:\"$name\") { suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 50) { nodes { login ... on Bot { id } } } } }" \
            --jq '.data.repository.suggestedActors.nodes[] | select(.login=="copilot-swe-agent") | .id' 2>/dev/null || true)
          issue_id=$(gh api "repos/$REPO/issues/$ISSUE" --jq .node_id 2>/dev/null || true)
          if [ -n "$bot_id" ] && [ -n "$issue_id" ] && \
             gh api graphql -f query="mutation { replaceActorsForAssignable(input: {assignableId: \"$issue_id\", actorIds: [\"$bot_id\"]}) { assignable { ... on Issue { number } } } }" >/dev/null 2>&1; then
            echo "status=assigned" >> "$GITHUB_OUTPUT"
          else
            echo "status=manual_handoff" >> "$GITHUB_OUTPUT"
          fi
        id: assignment
      - name: Record assignment status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
          ASSIGNMENT_STATUS: ${{ steps.assignment.outputs.status }}
        run: |
          if [ "$ASSIGNMENT_STATUS" = "assigned" ]; then
            note="Agent assignment recorded. Inference and review are not complete until the agent produces its report."
          else
            note="Agent assignment was not completed; manual handoff is required. Inference and review have not run."
          fi
          gh issue comment "$ISSUE" --repo "$REPO" --body "$note"
